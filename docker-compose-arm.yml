# ARM 差异层：与 docker-compose.yml（x86 主配置）合并启动。
#   docker compose -f docker-compose.yml -f docker-compose-arm.yml up -d
#
# 只改镜像、端口、HTTPS 证书等平台相关项；volumes / env / extra_hosts 等业务项跟 x86 主文件走。

services:
  fire_ops:
    image: docker.io/snail97/fire_ops_arm:latest
    expose: !reset []
    ports:
      - "18000:8000"

  # 镜像在 fire-admin 仓库构建：docker/build-arm.sh → fire-admin:latest
  front_html:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./data/front_html/log:/var/log/nginx
      - ./data/front_html/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/front_html/cert.pem:/etc/nginx/cert.pem:ro
      - ./data/front_html/private.key:/etc/nginx/private.key:ro
      - ./data/front_html/packages:/packages:ro

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2-linuxarm64
    ports:
      - "16379:6379"
    user: "501:501"

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:17-linuxarm64
    ports:
      - "15432:5432"
    user: "501:501"

  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:v1.14.1-linuxarm64
    ports:
      - "16333:6333"
      - "16334:6334"

