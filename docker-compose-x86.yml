services:
  fire_ops:
    image: fire_ops:dp
    build:
      context: ./src
      dockerfile: docker/Dockerfile
    container_name: fire_ops
    ports:
      # AutoDL 预留：外网 13445 → 内网 8892（原 MinerU，现改挂 fire_ops）
      - "8892:8000"
    depends_on:
      - redis
      - postgres
    env_file:
      - ./data/global_config/global_config.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/global_config/global_config.env:/app/global_config.env
      - ./data/fire_ops/data:/app/data
      - ./data/fire_ops/models:/app/models
      - ./data/fire_ops/logs:/app/logs
      - ./data/fire_ops/app_overlay/apps/utils/dp_client.py:/app/apps/utils/dp_client.py:ro
      - ./data/fire_ops/app_overlay/apps/utils/document_parser.py:/app/apps/utils/document_parser.py:ro
      - ./data/fire_ops/app_overlay/apps/utils/llm_optimizers.py:/app/apps/utils/llm_optimizers.py:ro
      - ./data/fire_ops/app_overlay/config.py:/app/config.py:ro
      - ./data/fire_ops/app_overlay/apps/models:/app/apps/models:ro
      - ./data/fire_ops/app_overlay/static/admin.html:/app/static/admin.html:ro
    restart: always

  # front_html:
  #   image: docker.io/snail97/fire-admin:latest
  #   container_name: front_html
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./data/front_html/cert.pem:/etc/nginx/cert.pem
  #     - ./data/front_html/private.key:/etc/nginx/private.key
  #     - ./data/front_html/log:/var/log/nginx
  #   restart: always

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2
    container_name: redis
    # 仅内部使用，不对外暴露
    # ports:
    #   - "16379:6379"
    volumes:
      - ./data/redis/data:/data
    restart: always

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:17
    container_name: postgres
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data
    # 仅内部使用，不对外暴露
    # ports:
    #   - "15432:5432"
    env_file:
      - ./data/global_config/global_config.env
    restart: always

  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:v1.14.1
    container_name: qdrant
    # 仅内部使用，不对外暴露
    # ports:
    #   - "16333:6333"
    #   - "16334:6334"
    volumes:
      - ./data/qdrant/data:/qdrant/storage
    restart: always
