version: "3.7"
services:
  fire_ops:
    image: snail97/fire_ops:latest
    ports:
      - 18000:8000
    depends_on:
      - redis
      - postgres
#      - elasticsearch
    env_file:
      - ./data/global_config/global_config.env
    volumes:
      - ./data/global_config/global_config.env:/app/global_config.env
      - ./data/fire_ops/data:/app/data
      - ./data/fire_ops/logs:/app/logs
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  front_html:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:1.27.4
    ports:
      - 80:80
      - 443:443
    volumes:
        - ./data/front_html/conf.d:/etc/nginx/conf.d
        - ./data/front_html/nginx.conf:/etc/nginx/nginx.conf
        - ./data/front_html/log:/var/log/nginx
        - ./data/front_html/cert.pem:/etc/nginx/cert.pem
        - ./data/front_html/private.key:/etc/nginx/private.key
    restart: always

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.2
    ports:
      - 16379:6379
    volumes:
      - ./data/redis/data:/data
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:17
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    env_file:
      - ./data/global_config/global_config.env
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/qdrant/qdrant:v1.14.1
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - ./data/qdrant/data:/qdrant/storage
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

